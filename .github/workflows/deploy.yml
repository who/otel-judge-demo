# Publishes the built static bundle to GitHub Pages on every push to main.
#
# The site is a project site served from https://who.github.io/otel-judge-demo/,
# so the Vite base path stays /otel-judge-demo/ and must not be overridden here.
# Public base URLs are injected at build time from repository *variables*
# (the vars context), never from the secrets context: per FR3 nothing secret
# may reach the Pages bundle. When the variables are unset the build still
# succeeds and the app falls back to mock mode, keeping a URL live.
#
# One-time human setup: Settings > Pages > Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum the deploy-pages action needs for its OIDC exchange.
permissions:
  contents: read
  pages: write
  id-token: write

# Overlapping pushes queue instead of interleaving two deployments.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_FIREHOSE_BASE: ${{ vars.VITE_FIREHOSE_BASE }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
